[package]
name = "goose-money"
version = "0.1.0"
description = "Goose Money"
edition = "2021"
rust-version = "1.90"

[lib]
name = "goose_money_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-fs = "=2.7.1"
tauri-plugin-deep-link = "=2.6.3"
# O bloco `plugins` do tauri.conf.json faz o generate_context! usar o serde_json.
serde_json = "=1.0.154"

# Windows e Linux: o link abre a janela que já está aberta, em vez de uma segunda instância.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "=2.5.5", features = ["deep-link"] }
