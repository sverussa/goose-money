      <div style="display: flex; gap: 8px">
        <button type="button" aria-pressed="true" style="height: 40px; padding: 0 14px; border-radius: 8px; border: 0; background: #CDE8DF; color: #072019; font-size: 14px; font-weight: 600">✓ Hoje</button>
        <button type="button" style="height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid #BFC9C4; background: #FFFFFF; color: #3F4945; font-size: 14px">Ontem</button>

    <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 500; color: #3F4945">Conta
