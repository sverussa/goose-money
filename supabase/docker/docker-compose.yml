# Supabase local por docker compose, sem a Supabase CLI (D80). Alternativa a make db-start:
# mesmas portas, chaves e Auth de supabase/config.toml, então .env, Flyway e testes valem para os dois modos.
# Não suba os dois ao mesmo tempo (as portas são as mesmas). Valores em local.env.
name: goose-money-supabase

services:
  db:
    image: public.ecr.aws/supabase/postgres:17.11.0.006
    ports: ["54322:5432"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: /var/run/postgresql
    volumes:
      - db:/var/lib/postgresql/data
      - ./senhas.sql:/etc/postgresql.schema.sql:ro # roda no primeiro start (migrate.sh da imagem)
    healthcheck:
      test: pg_isready -U postgres -h localhost
      interval: 2s
      retries: 30

  auth:
    image: public.ecr.aws/supabase/gotrue:v2.197.0
    depends_on:
      db: { condition: service_healthy }
      mailpit: { condition: service_started }
    environment:
      API_EXTERNAL_URL: http://127.0.0.1:54321/auth/v1
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgresql://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:1420
      GOTRUE_URI_ALLOW_LIST: http://localhost:1420/**,http://localhost:1421/**,http://localhost:1422/**,http://localhost:1423/**,http://localhost:1424/**,goosemoney://**
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_SECURITY_MANUAL_LINKING_ENABLED: "false"
      GOTRUE_PASSWORD_MIN_LENGTH: "8"
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ISSUER: http://127.0.0.1:54321/auth/v1
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: "10"
      GOTRUE_SECURITY_UPDATE_PASSWORD_REQUIRE_REAUTHENTICATION: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "false" # confirmação de e-mail ligada
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: "true"
      GOTRUE_MAILER_OTP_EXP: "3600"
      GOTRUE_MAILER_OTP_LENGTH: "6"
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: http://127.0.0.1:54321/auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: http://127.0.0.1:54321/auth/v1/verify
      GOTRUE_MAILER_URLPATHS_INVITE: http://127.0.0.1:54321/auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: http://127.0.0.1:54321/auth/v1/verify
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: "1025"
      GOTRUE_SMTP_ADMIN_EMAIL: admin@email.com
      GOTRUE_SMTP_SENDER_NAME: Admin
      GOTRUE_SMTP_MAX_FREQUENCY: 1s
      # A CLI troca o email_sent do config.toml por este valor quando usa o Mailpit; os e2e dependem disso.
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "360000"
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: "150"
      GOTRUE_RATE_LIMIT_VERIFY: "30"
      GOTRUE_RATE_LIMIT_OTP: "30"
      GOTRUE_RATE_LIMIT_ANONYMOUS_USERS: "30"
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: "false"
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: "false"
      GOTRUE_MFA_PHONE_ENROLL_ENABLED: "false"
      GOTRUE_MFA_PHONE_VERIFY_ENABLED: "false"
      GOTRUE_MFA_MAX_ENROLLED_FACTORS: "10"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:9999/health
      interval: 2s
      retries: 30

  rest:
    image: public.ecr.aws/supabase/postgrest:v16.5
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgresql://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,graphql_public
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_JWT_SECRET: ${JWT_SECRET}

  kong:
    image: ghcr.io/supabase/kong:2.8.1
    ports: ["54321:8000"]
    depends_on: [auth, rest]
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_PLUGINS: cors
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_DNS_VALID_TTL: "5"
      KONG_DNS_NOT_FOUND_TTL: "1"
      KONG_NGINX_WORKER_PROCESSES: "1"
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
    volumes:
      - ./kong.yml:/home/kong/kong.yml:ro
    healthcheck:
      test: kong health
      interval: 2s
      retries: 30

  meta:
    image: public.ecr.aws/supabase/postgres-meta:v0.100.0
    depends_on:
      db: { condition: service_healthy }
    environment:
      PG_META_PORT: "8080"
      PG_META_DB_HOST: db
      PG_META_DB_PORT: "5432"
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}

  studio:
    image: public.ecr.aws/supabase/studio:2026.10.19-sha-b375769
    ports: ["54323:3000"]
    depends_on: [meta, kong]
    environment:
      HOSTNAME: 0.0.0.0
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: http://127.0.0.1:54321
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_SCHEMAS: public,graphql_public
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_MAX_ROWS: "1000"
      NEXT_PUBLIC_ENABLE_LOGS: "false"

  mailpit:
    image: public.ecr.aws/supabase/mailpit:v1.31.3
    ports: ["54324:8025"]
    environment:
      MP_SMTP_DISABLE_RDNS: "true"

volumes:
  db:
